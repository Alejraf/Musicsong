<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffe2c6"/>
      <stop offset="0.55" stop-color="#f6bd8e"/>
      <stop offset="1" stop-color="#cf8456"/>
    </radialGradient>
    <radialGradient id="hair" cx="0.4" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#6b4630"/>
      <stop offset="1" stop-color="#24140d"/>
    </radialGradient>
    <radialGradient id="cup" cx="0.33" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#7ff5e3"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0b5f58"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff5e3"/>
      <stop offset="1" stop-color="#0f9488"/>
    </linearGradient>
    <radialGradient id="shirt" cx="0.4" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- fondo -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="235" r="235" fill="url(#glow)"/>

  <!-- notas musicales -->
  <g transform="translate(104 112) rotate(-14)" fill="#ffffff" opacity="0.92">
    <ellipse cx="0" cy="40" rx="15" ry="11"/>
    <rect x="12" y="-18" width="5" height="58" rx="2"/>
    <path d="M17 -18 q26 6 20 32 q-4 -16 -20 -18z"/>
  </g>
  <g transform="translate(392 126) rotate(12) scale(0.8)" fill="#ffffff" opacity="0.92">
    <ellipse cx="0" cy="40" rx="15" ry="11"/>
    <rect x="12" y="-18" width="5" height="58" rx="2"/>
    <path d="M17 -18 q26 6 20 32 q-4 -16 -20 -18z"/>
  </g>

  <!-- hombros y cuello -->
  <ellipse cx="256" cy="522" rx="172" ry="104" fill="url(#shirt)"/>
  <rect x="226" y="378" width="60" height="76" rx="22" fill="#d98f60"/>
  <ellipse cx="256" cy="398" rx="60" ry="14" fill="#7a3f1d" opacity="0.3" filter="url(#blur)"/>

  <!-- orejas -->
  <ellipse cx="140" cy="270" rx="16" ry="26" fill="#e8a574"/>
  <ellipse cx="372" cy="270" rx="16" ry="26" fill="#e8a574"/>

  <!-- cabeza -->
  <ellipse cx="256" cy="262" rx="118" ry="128" fill="url(#skin)"/>
  <ellipse cx="214" cy="190" rx="58" ry="34" fill="#ffffff" opacity="0.22" filter="url(#blur)"/>

  <!-- pelo -->
  <path d="M138 238 C128 140 196 110 256 110 C316 110 384 140 374 238 C350 196 312 176 256 176 C200 176 162 196 138 238 Z" fill="url(#hair)"/>
  <ellipse cx="220" cy="140" rx="40" ry="14" fill="#ffffff" opacity="0.18" filter="url(#blur)"/>

  <!-- diadema de los audífonos -->
  <path d="M122 268 C106 62 406 62 390 268" fill="none" stroke="#0b5f58" stroke-width="26" stroke-linecap="round" opacity="0.35" transform="translate(0 4)"/>
  <path d="M122 268 C106 62 406 62 390 268" fill="none" stroke="url(#band)" stroke-width="22" stroke-linecap="round"/>
  <path d="M146 214 C170 120 342 120 366 214" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>

  <!-- cejas levantadas -->
  <path d="M196 222 Q220 206 240 220" fill="none" stroke="#24140d" stroke-width="8" stroke-linecap="round"/>
  <path d="M272 220 Q292 206 316 222" fill="none" stroke="#24140d" stroke-width="8" stroke-linecap="round"/>

  <!-- ojos felices (cerrados, disfrutando) -->
  <path d="M200 262 Q220 234 240 262" fill="none" stroke="#2a1510" stroke-width="9" stroke-linecap="round"/>
  <path d="M272 262 Q292 234 312 262" fill="none" stroke="#2a1510" stroke-width="9" stroke-linecap="round"/>

  <!-- mejillas -->
  <ellipse cx="196" cy="300" rx="22" ry="14" fill="#ff7a8a" opacity="0.5"/>
  <ellipse cx="316" cy="300" rx="22" ry="14" fill="#ff7a8a" opacity="0.5"/>

  <!-- nariz -->
  <path d="M250 282 Q256 296 266 290" fill="none" stroke="#c07448" stroke-width="5" stroke-linecap="round"/>

  <!-- boca abierta, emocionada -->
  <path d="M206 308 Q256 318 306 308 Q298 372 256 372 Q214 372 206 308 Z" fill="#7a1f2b"/>
  <path d="M212 311 Q256 321 300 311 Q298 328 256 330 Q214 328 212 311 Z" fill="#ffffff"/>
  <ellipse cx="256" cy="360" rx="26" ry="11" fill="#f472b6"/>

  <!-- almohadillas de los audífonos -->
  <ellipse cx="122" cy="274" rx="32" ry="54" fill="url(#cup)"/>
  <ellipse cx="122" cy="274" rx="19" ry="38" fill="#0b5f58" opacity="0.55"/>
  <ellipse cx="112" cy="252" rx="9" ry="20" fill="#ffffff" opacity="0.4"/>
  <ellipse cx="390" cy="274" rx="32" ry="54" fill="url(#cup)"/>
  <ellipse cx="390" cy="274" rx="19" ry="38" fill="#0b5f58" opacity="0.55"/>
  <ellipse cx="380" cy="252" rx="9" ry="20" fill="#ffffff" opacity="0.4"/>
</svg>
