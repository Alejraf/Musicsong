<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vibra</title>
<meta name="description" content="Aprende con vídeos: rutas, notas y progreso. / Aprenda com vídeos: rotas, notas e progresso.">
<meta name="theme-color" content="#1a1030">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vibra">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#1a1030; --card:#251847; --card2:#2f2058; --text:#ece8f7; --muted:#a79fc2;
    --accent:#ec4899; --accent2:#7ff5e3; --danger:#f87171; --line:#3d2e6b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main{max-width:720px;margin:0 auto;padding:12px 14px 40px}
  header{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
  header img{width:44px;height:44px;border-radius:12px}
  header .ttl{flex:1;min-width:0}
  header h1{font-size:1.4rem;margin:0}
  header p{margin:0;color:var(--muted);font-size:.85rem}
  .lang{display:flex;gap:4px;flex:none}
  .lang button{padding:6px 10px;font-size:.8rem;font-weight:700;border:1px solid var(--line);background:transparent}
  .lang button.on{background:var(--accent2);color:#12202b;border-color:var(--accent2)}
  h2{font-size:1rem;margin:0 0 8px;color:#f9a8d4}

  button{font:inherit;color:var(--text);background:var(--card2);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
  button:active{transform:scale(.97)}
  button.primary{background:var(--accent);color:#fff;font-weight:600}
  button.ghost{background:transparent;border:1px solid var(--line)}
  button.icon{padding:8px 10px}
  button:disabled{opacity:.4}
  .row{display:flex;gap:8px;align-items:center}
  .muted{color:var(--muted);font-size:.9rem}

  /* Hábito */
  .habit{background:var(--card);border-radius:14px;padding:12px;margin:0 0 12px}
  .resume{margin-bottom:10px}
  .resume button{width:100%;text-align:left;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .hrow .hl{display:flex;flex-direction:column;gap:2px;min-width:0}
  .hrow strong{font-size:.95rem}
  .hrow .streak{font-size:.85rem;color:var(--accent2)}
  .hrow button{padding:6px 10px;font-size:.8rem}

  /* Rutas */
  .routes{margin:0 0 14px}
  .routes .sub{margin:-4px 0 8px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px 12px;font-size:.85rem;background:var(--card);border:1px solid var(--line)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .rlist{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#3d2e6b transparent}
  .rcard{flex:none;width:210px;background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start}
  .rcard .rtop{font-size:1.8rem;line-height:1}
  .rcard .rtitle{font-weight:700}
  .rcard .rdesc{font-size:.8rem;color:var(--muted);flex:1}
  .rcard .rmeta{font-size:.75rem;color:var(--accent2)}
  .rcard button{width:100%}

  /* Reproductor oficial de YouTube: siempre visible, sin recortes ni ocultamiento */
  .player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
  .player-wrap #player,.player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:20px;color:var(--muted);background:linear-gradient(135deg,#2a1a52,#3b1d57)}
  .nowplaying{margin:10px 2px 0;min-height:1.4em;font-weight:600}
  .nowplaying a{font-weight:400;font-size:.8rem;color:var(--accent2);margin-left:8px;white-space:nowrap}
  .hint{color:var(--muted);font-size:.8rem;margin:2px 2px 0}
  .controls{margin:12px 0}

  /* Notas con marca de tiempo */
  .notes{background:var(--card);border-radius:14px;padding:12px;margin:6px 0 14px}
  .notes .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .notes .head h2{margin:0}
  .noteform{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .noteform textarea{width:100%;min-height:76px;resize:vertical;font:inherit;color:var(--text);background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
  .noteform textarea:focus{border-color:var(--accent2)}
  ul.nlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .note{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border-radius:10px;padding:8px}
  .note .time{flex:none;background:#12202b;color:var(--accent2);font-weight:700;border-radius:8px;padding:4px 9px;font-variant-numeric:tabular-nums}
  .note .txt{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-size:.92rem;padding-top:2px}
  .note .x{flex:none;padding:2px 8px;background:transparent;color:var(--muted)}

  .add{margin:14px 0}
  .add input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:11px 12px;outline:none}
  .add input:focus{border-color:var(--accent2)}

  .listbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 8px}
  .listbar select{flex:1;min-width:140px;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px}
  .desc{color:var(--muted);font-size:.9rem;margin:4px 2px 8px;white-space:pre-wrap}
  .progress-box{margin:6px 2px 12px}
  .progress-box .lbl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:4px}
  .progress{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}

  ul.tracks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .track{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px;cursor:pointer}
  .track.active{outline:2px solid var(--accent);background:var(--card2)}
  .track img{width:96px;height:54px;object-fit:cover;border-radius:8px;flex:none;background:#000}
  .track .t{flex:1;min-width:0;font-size:.92rem}
  .track .t .ttl{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .track .t .meta{font-size:.75rem;color:var(--muted);margin-top:2px}
  .track.done .t .ttl{opacity:.65}
  .track .t .ok{color:var(--accent2);font-weight:600}
  .acts{display:grid;grid-template-columns:repeat(2,34px);gap:4px;flex:none}
  .acts button{padding:0;height:30px;font-size:.85rem;background:var(--card2)}
  .acts button.on{background:var(--accent2);color:#12202b;font-weight:700}
  .empty{color:var(--muted);text-align:center;padding:26px 10px;background:var(--card);border-radius:12px}

  /* Publicidad: solo en la zona de las listas, nunca junto al reproductor */
  .ads{margin:18px 0 0;text-align:center}
  .ads .adlabel{font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
  .ads iframe{width:100%;border:0;border-radius:10px;background:#00000033;display:block}
  .ads button{margin-top:8px}
  .premium{background:var(--card);border-radius:14px;padding:14px;margin:14px 0;display:flex;flex-direction:column;gap:10px}
  .premium input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:11px 12px;outline:none}
  .premium input:focus{border-color:var(--accent2)}
  .premium p{margin:0}

  footer{margin-top:28px;color:var(--muted);font-size:.78rem;line-height:1.5}
  footer a{color:var(--accent2)}
  footer .links{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#000c;color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;
    transition:opacity .2s;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.svg" alt="Logo de Vibra">
    <div class="ttl">
      <h1>Vibra</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Idioma / Idioma">
      <button id="langEs" type="button">ES</button>
      <button id="langPt" type="button">PT</button>
    </div>
  </header>

  <!-- Hábito: continuar, minutos de hoy y racha -->
  <section class="habit" id="habitBox">
    <div class="resume" id="resume" hidden><button id="resumeBtn" class="primary" type="button"></button></div>
    <div class="hrow">
      <div class="hl"><strong id="habToday"></strong><span class="streak" id="habStreak"></span></div>
      <button id="habGoal" class="ghost" type="button"></button>
    </div>
    <div class="progress"><i id="habBar"></i></div>
  </section>

  <!-- Rutas para empezar sin buscar nada -->
  <section class="routes" id="routesBox">
    <h2 data-i18n="routesTitle"></h2>
    <div class="muted sub" data-i18n="routesSub"></div>
    <div class="chips" id="chips"></div>
    <div class="rlist" id="routeList"></div>
  </section>

  <!-- Reproductor oficial (YouTube IFrame Player API). No se oculta, no se recorta y no se modifican sus controles. -->
  <section class="player-wrap" id="playerSection" data-i18n-aria="playerAria">
    <div id="player"></div>
    <div class="placeholder" id="placeholder" data-i18n="placeholder"></div>
  </section>
  <div class="nowplaying"><span id="npTitle"></span><a id="ytLink" href="#" target="_blank" rel="noopener" hidden data-i18n="openYT"></a></div>
  <div class="hint" data-i18n="hintPause"></div>

  <div class="row controls">
    <button id="prev" class="icon" disabled data-i18n="prev"></button>
    <button id="next" class="icon" disabled data-i18n="next"></button>
  </div>

  <!-- Notas con marca de tiempo -->
  <section class="notes">
    <div class="head">
      <h2 data-i18n="notesTitle"></h2>
      <button id="addNote" class="primary" disabled data-i18n="addNote"></button>
    </div>
    <div class="noteform" id="noteForm" hidden>
      <div class="muted"><span data-i18n="noteAtMinute"></span> <strong id="noteTime">0:00</strong></div>
      <textarea id="noteText" maxlength="500" data-i18n-ph="notePh"></textarea>
      <div class="row">
        <button id="noteSave" class="primary" data-i18n="noteSave"></button>
        <button id="noteCancel" class="ghost" data-i18n="cancel"></button>
      </div>
    </div>
    <ul class="nlist" id="notesList"></ul>
  </section>

  <form class="add row" id="addForm" autocomplete="off">
    <input id="url" type="url" inputmode="url" data-i18n-ph="urlPh" data-i18n-aria="urlPh">
    <button class="primary" type="submit" data-i18n="add"></button>
  </form>

  <div class="listbar">
    <select id="listSelect"></select>
    <button id="newList" class="ghost" data-i18n="newList"></button>
    <button id="renameList" class="ghost" data-i18n="rename"></button>
    <button id="descList" class="ghost" data-i18n="descBtn"></button>
    <button id="shareList" class="ghost" data-i18n="share"></button>
    <button id="deleteList" class="ghost" data-i18n="del"></button>
  </div>
  <div class="desc" id="listDesc"></div>
  <div class="progress-box" id="progressBox" hidden>
    <div class="lbl"><span id="progText"></span><span id="progPct"></span></div>
    <div class="progress"><i id="progBar"></i></div>
  </div>

  <ul class="tracks" id="tracks"></ul>

  <!-- Publicidad (solo banners, en un marco aislado). Se oculta con Premium. -->
  <section class="ads" id="adWrap" hidden>
    <div class="adlabel" data-i18n="adLabel"></div>
    <iframe id="adFrame" title="Publicidad" scrolling="no"></iframe>
    <button id="goPremium" class="ghost" data-i18n="removeAds"></button>
  </section>

  <section class="premium" id="premiumBox" hidden>
    <h2 data-i18n="premTitle"></h2>
    <p class="muted" data-i18n="premText"></p>
    <div class="row"><button id="payBtn" class="primary" data-i18n="payMp"></button></div>
    <p class="muted" data-i18n="premCodeInfo"></p>
    <div class="row">
      <input id="premiumCode" maxlength="100" data-i18n-ph="codePh" autocomplete="off" autocapitalize="off">
      <button id="activateBtn" class="primary" data-i18n="activate"></button>
    </div>
    <div><button id="premiumClose" class="ghost" data-i18n="close"></button></div>
  </section>

  <footer>
    <div><span data-i18n="f1a"></span>
      <a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener" data-i18n="f1b"></a>
      <span data-i18n="f1c"></span>
      <a href="http://www.google.com/policies/privacy" target="_blank" rel="noopener" data-i18n="f1d"></a>.
      <span data-i18n="f1e"></span></div>
    <div class="links">
      <a href="privacy.html" data-i18n="privacyLink"></a>
      <a href="#" id="wipe" data-i18n="wipe"></a>
    </div>
  </footer>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="rutas.js"></script>

  // Guardar el minuto exacto para poder continuar después.

  function playAt(li, i){

    state.last = { listId:list.id, id:id }; save();

  /* ---------- Títulos (oEmbed público, solo en memoria) ---------- */
  function fetchTitle(id){

  /* ---------- Hábito: minutos de hoy, racha y meta ---------- */
  function rollover(){

    var input = $('url'), id = parseId(input.value);
    if(!id){ toast(t('notValid')); return; }
    if(!addVideoToCurrent(id)){ toast(t('already')); return; }
    input.value = ''; renderAll(); toast(t('added'));
  });
  $('prev').addEventListener('click', function(){ step(-1); });
  $('next').addEventListener('click', function(){ step(1); });
  $('addNote').addEventListener('click', openNoteForm);
  $('noteSave').addEventListener('click', saveNote);
  $('noteCancel').addEventListener('click', closeNoteForm);
  $('listSelect').addEventListener('change', function(e){
    state.current = +e.target.value; save(); renderDesc(); renderProgress(); renderTracks();
  });
  $('newList').addEventListener('click', function(){
    var n = prompt(t('newListPrompt')); if(!n) return;
    state.lists.push({ id:uid(), name:n.trim().slice(0,40) || 'Lista', description:'', items:[] });
    state.current = state.lists.length - 1; save(); renderAll();
  });
  $('renameList').addEventListener('click', function(){
    var n = prompt(t('renamePrompt'), cur().name); if(!n) return;
    cur().name = n.trim().slice(0,40) || cur().name; save(); renderSelect();
  });
  $('descList').addEventListener('click', function(){
    var d = prompt(t('descPrompt'), cur().description || '');
    if(d === null) return;
    cur().description = d.trim().slice(0, 200); save(); renderDesc();
  });
  $('deleteList').addEventListener('click', function(){
    if(state.lists.length <= 1) return;
    if(!confirm(t('confirmDelete', cur().name))) return;
    var removed = state.current;
    state.lists.splice(removed, 1);
    if(playing.list === removed) playing = { list:-1, index:-1 };
    else if(playing.list > removed) playing.list--;
    state.current = Math.max(0, removed - 1); save(); renderAll();
  });
  $('shareList').addEventListener('click', function(){
    var l = cur();
    if(!l.items.length){ toast(t('emptyShare')); return; }
    var link = location.href.split('#')[0].split('?')[0] + '#l=' + encodeURIComponent(l.name) + '~' + l.items.join(',') +
      (l.description ? '~' + encodeURIComponent(l.description) : '');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){ toast(t('linkCopied')); },
        function(){ prompt(t('copyPrompt'), link); });
    } else { prompt(t('copyPrompt'), link); }
  });
  $('wipe').addEventListener('click', function(e){
    e.preventDefault();
    if(!confirm(t('confirmWipe'))) return;
    try{ localStorage.removeItem(KEY); }catch(_){}
    setPremium(false); $('premiumBox').hidden = true;
    state = load(); playing = { list:-1, index:-1 };
    if(ready && player) try{ player.stopVideo(); }catch(_){}
    closeNoteForm();
    $('placeholder').style.display = ''; renderAll(); toast(t('wiped'));
  });

  /* ---------- Publicidad (solo banners) y Premium ---------- */
  var CFG = window.VIBRA_CONFIG || {};
  var PKEY = 'vibra.premium';
  var adLoaded = false;
  function isPremium(){ try{ return localStorage.getItem(PKEY) === '1'; }catch(e){ return false; } }
  function setPremium(v){ try{ if(v) localStorage.setItem(PKEY, '1'); else localStorage.removeItem(PKEY); }catch(e){} }

  function renderAds(){
    var wrap = $('adWrap'), f = $('adFrame');
    var show = !!(CFG.adsEnabled && CFG.adSnippet && !isPremium());
    wrap.hidden = !show;
    if(show && !adLoaded){
      // Marco aislado: el anuncio no puede leer Vibra ni redirigir la página.
      f.setAttribute('sandbox', 'allow-scripts' + (CFG.adAllowClicks === false ? '' : ' allow-popups allow-popups-to-escape-sandbox'));
      f.style.height = (CFG.adHeight || 100) + 'px';
      f.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;display:flex;justify-content:center}</style></head><body>' + CFG.adSnippet + '</body></html>';
      adLoaded = true;
    } else if(!show && adLoaded){
      f.removeAttribute('srcdoc'); f.src = 'about:blank'; adLoaded = false;
    }
  }
  $('goPremium').addEventListener('click', function(){
    $('premiumBox').hidden = false;
    try{ $('premiumBox').scrollIntoView({ behavior:'smooth', block:'center' }); }catch(_){}
  });
  $('premiumClose').addEventListener('click', function(){ $('premiumBox').hidden = true; });
  $('payBtn').addEventListener('click', function(){
    if(!CFG.checkoutUrl){ toast(t('payNotCfg')); return; }
    window.open(CFG.checkoutUrl, '_blank', 'noopener');
  });
  $('activateBtn').addEventListener('click', function(){
    var code = $('premiumCode').value.trim().slice(0, 100);
    if(!code){ toast(t('writeCode')); return; }
    if(!CFG.verifyUrl){ toast(t('activateNotCfg')); return; }
    var btn = $('activateBtn'); btn.disabled = true;
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var to = setTimeout(function(){ if(ctl) ctl.abort(); }, 15000);
    var url = CFG.verifyUrl + (CFG.verifyUrl.indexOf('?') > -1 ? '&' : '?') + 'code=' + encodeURIComponent(code);
    fetch(url, ctl ? { signal:ctl.signal } : {})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){
        if(j && j.valid === true){
          setPremium(true); $('premiumBox').hidden = true; $('premiumCode').value = '';
          renderAds(); toast(t('premiumOn'));
        } else { toast(t('badCode')); }
      })
      .catch(function(){ toast(t('verifyFail')); })
      .then(function(){ clearTimeout(to); btn.disabled = false; });
  });

  /* ---------- Importar lista compartida (enlace #l=...) ---------- */
  function importFromHash(){
    var m = location.hash.match(/^#l=([^~]*)~([^~]+)(?:~(.*))?$/);
    if(!m) return;
    var name = t('sharedListName'), desc = '';
    try{ name = decodeURIComponent(m[1]).slice(0,40) || name; }catch(_){}
    try{ desc = decodeURIComponent(m[3] || '').slice(0,200); }catch(_){}
    var ids = m[2].split(',').filter(function(x){ return ID_RE.test(x); }).slice(0,200);
    history.replaceState(null, '', location.href.split('#')[0]);
    if(!ids.length) return;
    if(!confirm(t('importQ', name, ids.length))) return;
    state.lists.push({ id:uid(), name:name, description:desc, items:ids });
    state.current = state.lists.length - 1; save();
  }

  /* ---------- Recibir un vídeo con "Compartir" desde YouTube (Android, app instalada) ---------- */
  function handleShareTarget(){
    var q;
    try{ q = new URLSearchParams(location.search); }catch(_){ return; }
    if(!(q.has('url') || q.has('text') || q.has('title'))) return;
    var cands = [q.get('url') || '', q.get('text') || '', q.get('title') || ''], id = null;
    cands.forEach(function(c){
      if(id) return;
      id = parseId(c);
      if(!id){
        var links = c.match(/https?:\/\/[^\s]+/g) || [];
        for(var i = 0; i < links.length && !id; i++) id = parseId(links[i]);
      }
    });
    try{ history.replaceState(null, '', location.href.split('?')[0].split('#')[0]); }catch(_){}
    if(!id){ setTimeout(function(){ toast(t('sharedBad')); }, 300); return; }
    var isNew = addVideoToCurrent(id);
    setTimeout(function(){ toast(isNew ? t('sharedAdded') : t('already')); }, 300);
  }

  /* ---------- Arranque ---------- */
  applyLang();
  importFromHash();
  handleShareTarget();
  renderAll();
  loadApi();
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
